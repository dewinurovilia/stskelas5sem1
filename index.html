<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Kelas V SD</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <h1>KELAS V SD NEGERI DUKOHKDIUL</h1>
  <p>Assesmen Tengah Semester</p>
  <p>Tahun Pelajaran 2026/2027 Semester I</p>
</header>

<main class="container">
  <section class="card">
    <h2>Pilih Mata Pelajaran</h2>
    <div id="subjectButtons" class="subjects"></div>
  </section>

  <section id="studentCard" class="card student-card hidden">
    <div class="form-grid">
      <label>Nama Siswa *
        <input id="studentName" type="text" placeholder="Masukkan nama siswa">
      </label>
      <label>Kelas *
        <input id="studentClass" type="text" value="V">
      </label>
    </div>
  </section>

  <section id="examCard" class="card hidden">
    <div class="exam-head">
      <div>
        <h2 id="examTitle"></h2>
        <p id="examInfo"></p>
      </div>
      <div id="timer" class="timer">00:00</div>
    </div>
    <div id="questions"></div>
    <button id="submitBtn" class="submit-btn">Kumpulkan Jawaban</button>
    <div id="result" class="result hidden"></div>
  </section>
</main>

<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close" aria-label="Tutup">×</button>
    <div class="lock">🔐</div>
    <h3 id="passwordTitle">Masukkan Password</h3>
    <p>Masukkan password untuk membuka ujian mata pelajaran ini.</p>
    <input id="passwordInput" type="password" placeholder="Password">
    <button id="passwordBtn" class="primary-btn">Buka Ujian</button>
    <div id="passwordError" class="error"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
